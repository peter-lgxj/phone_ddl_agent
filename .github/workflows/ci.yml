name: ci

on:
  # 只有 main 的 push 需要单独跑；feature 分支交给 pull_request，避免同一提交双跑。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新推送取消旧 run，避免排队与失败邮件堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # 依赖唯一真源：本地与 CI 都从 requirements-lock.txt 安装（含 pytest/ruff/openpyxl）。
      - name: Install dependencies from lock file
        run: |
          python -m pip install --upgrade pip
          if grep -q -- '--hash=' requirements-lock.txt; then
            pip install --require-hashes -r requirements-lock.txt
          else
            pip install -r requirements-lock.txt
          fi

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Parse every Python file
        run: python -m compileall -q .

      - name: Validate task set JSON
        run: python -m json.tool experiments/tasks.json > /dev/null

      - name: Experiment runner dry-run
        run: python experiments/run_experiment.py --tasks experiments/tasks.json --dry-run

      - name: Lint (error-level rules only)
        run: ruff check .

      # 防止「新测试 import 了新包，但没写进 lock」：静态扫描 tests/ 的第三方 import。
      - name: Check test dependencies are locked
        run: python scripts/check_test_deps.py

      - name: Import smoke test
        run: python -c "import flask, openai, cv2, torch, uiautomator2, openpyxl, pytest; print('lock-ok')"

      - name: Unit tests
        run: pytest -q
